services:
  server:
    build: .
    command: python -m src.main_server
    ports:
      - "8080:8080"
    env_file: .env
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1

  controller:
    build: .
    command: python -m src.main_controller
    env_file: .env
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
